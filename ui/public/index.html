<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BayouFinds AD Audit Toolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">BayouFinds</p>
        <h1>AD Audit & Operations Toolkit</h1>
        <p class="sub">Run structured audit checks, generate CSV evidence, and keep identity review work organized.</p>
      </div>
      <div class="badge">Early UI Skeleton</div>
    </header>

    <section class="grid" id="tools"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Execution Output</h2>
        <span id="status">Idle</span>
      </div>
      <pre id="output">Select a tool to run.</pre>
    </section>

    <footer>
      © BayouFinds.com — AD Audit & Operations Toolkit
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
